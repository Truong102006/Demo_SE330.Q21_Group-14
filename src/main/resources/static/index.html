<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo Spring Boot</title>
    <link rel="stylesheet" href="/styles.css?v=20260506-1">
</head>
<body>
<main class="shell">
    <section class="hero">
        <div>
            <p class="eyebrow">Spring Boot REST API</p>
            <h1>Quản lý sinh viên</h1>
            <p class="lead">Demo CRUD với Controller, Service, Repository, Spring Data JPA và H2 Database.</p>
        </div>
        <div class="status" id="healthStatus">Đang kiểm tra API...</div>
    </section>

    <section class="workspace">
        <form class="panel" id="studentForm">
            <input type="hidden" id="studentId">
            <h2 id="formTitle">Thêm sinh viên</h2>

            <label>
                Họ tên
                <input id="fullName" name="fullName" required placeholder="Nguyễn Văn An">
            </label>

            <label>
                Email
                <input id="email" name="email" type="email" required placeholder="an@example.com">
            </label>

            <label>
                Ngành học
                <input id="major" name="major" required placeholder="Công nghệ thông tin">
            </label>

            <label>
                GPA
                <input id="gpa" name="gpa" type="number" min="0" max="4" step="0.1" required placeholder="3.5">
            </label>

            <div class="actions">
                <button type="submit" class="primary" id="saveButton">Lưu</button>
                <button type="button" id="resetButton">Nhập mới</button>
            </div>

            <p class="message" id="formMessage"></p>
        </form>

        <section class="panel list-panel">
            <div class="list-heading">
                <div>
                    <h2>Danh sách sinh viên</h2>
                    <p id="studentCount">0 sinh viên</p>
                </div>
                <label class="search">
                    Lọc ngành
                    <input id="majorSearch" placeholder="VD: dữ liệu">
                </label>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Họ tên</th>
                        <th>Email</th>
                        <th>Ngành</th>
                        <th>GPA</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="studentTable"></tbody>
                </table>
            </div>
        </section>
    </section>
</main>

<div class="modal-overlay hidden" id="confirmDeleteModal" role="dialog" aria-modal="true" aria-labelledby="confirmDeleteTitle" hidden>
    <div class="modal-card">
        <h3 id="confirmDeleteTitle">Xác nhận xóa</h3>
        <p>Bạn có chắc chắn muốn xóa không?</p>
        <div class="actions">
            <button type="button" class="danger" id="confirmDeleteButton">Xác nhận</button>
            <button type="button" id="cancelDeleteButton">Hủy</button>
        </div>
    </div>
</div>

<script src="/app.js?v=20260506-1"></script>
</body>
</html>
